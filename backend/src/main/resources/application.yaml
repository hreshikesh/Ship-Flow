server:
  port: 8080

spring:
  application:
    name: Shipflow

  datasource:
    url: ${DATABASE-URL}
    username: ${DATABASE-USER}
    password: ${DATABASE-PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL-USER}
    password: ${EMAIL-PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


gemini:
  api:
    key: ${GEMINI-API}
    chat-model: gemini-2.5-flash
    embedding-model: gemini-embedding-001
    embedding-dimension: 768
    temperature: 0.2
    max-output-tokens: 2048
groq:
  api:
    key: ${GROQ-API}
    model: llama-3.3-70b-versatile
    max-tokens: 1024
    temperature: 0.2
rag:
  chunk-size: 600
  chunk-overlap: 150
  top-k: 6
  pdf-path: knowledge/SHIPFLOW_Manual.pdf
  content-start-page: 27
  skip-pages-start: 26
  skip-pages-end: 0

sandebtech:
  mail:
    contact-recipient: ${EMAIL-USER}

logging:
  level:
    org.springframework.mail: DEBUG
    org.hibernate.SQL: DEBUG
    com.shipflow: DEBUG